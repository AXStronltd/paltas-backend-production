# Render Blueprint for the PALTAS API (AXStronltd/paltas-backend-production).
# Nothing here is applied until someone creates a Blueprint from it in the Render dashboard.
# Secrets are NOT in this file: values marked `sync: false` are entered in the dashboard.
# The live PALTAS API (paltas.io proxies /api/* here), with its own database. The old backend is kept only in the
# paltas-backend-production-back-up branch and the old-backend-final tag.
services:
  - type: web
    name: paltas-api-v2
    runtime: node
    branch: main
    # TypeScript is compiled at build time; dev dependencies (the compiler) are needed for that step
    buildCommand: npm ci --include=dev && npm run build
    # Applies any pending database migrations (under a lock), then serves on Render's $PORT
    startCommand: node server/dist/main.js
    # Answers 200 only when the process runs AND the database answers (503 otherwise). Migrations are applied before
    # the server listens, so a server that answers here is also up to date; /api/v1/ready additionally lists the
    # migration state for deploy checks and monitoring.
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: paltas-v2-db
          property: connectionString
      - key: BILLING_MODE
        value: provider
      - key: TRUST_PROXY
        value: "true"
      - key: SESSION_MINUTES
        value: "30"
      - key: LOG_LEVEL
        value: info
      # 32 random bytes, base64 (openssl rand -base64 32). Encrypts authenticator secrets. Keep it safe: losing it
      # makes every stored two-factor secret unreadable.
      - key: SECRETS_KEY
        sync: false
      # The front-end origin(s) allowed to call the API, e.g. https://paltashub.com
      - key: CORS_ORIGINS
        sync: false
      # One per payment provider adapter when one exists, e.g. WEBHOOK_SECRET_MPESA (none connected yet)
      # Scheduler worker (platform jobs, night audits, rent invoicing) runs in this service; the other SCHEDULER_*
      # settings (poll, lease, retries, renewal lead days) keep the defaults in server/.env.example
      - key: SCHEDULER_WORKER
        value: "true"
      # The background data-migration import worker; MIGRATION_* limits keep the defaults in server/.env.example
      - key: MIGRATION_WORKER
        value: "true"
      # Catalogue price changes need a second Super Admin's approval (also the production default)
      - key: CATALOGUE_PRICE_APPROVAL
        value: "true"
      # Render waits about 30 seconds after SIGTERM; finish requests and the current job well before that
      - key: SHUTDOWN_TIMEOUT_MS
        value: "25000"
      # Self-service sign-up and free trials (the trial policy itself is a database row the Super Admin changes)
      - key: SIGNUP_ENABLED
        value: "true"
      # The version of the published PALTAS terms a sign-up must accept
      - key: SIGNUP_TERMS_VERSION
        value: "2026-10"
      # The front end that hosts /verify-email (verification links point there). Required while sign-up is on:
      # the server refuses to start in production with sign-up on and a local address here.
      - key: APP_BASE_URL
        value: https://paltas.io

databases:
  - name: paltas-v2-db
    databaseName: paltas
    postgresMajorVersion: "16"
