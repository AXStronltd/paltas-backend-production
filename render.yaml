# ======================================================================
# Render blueprint for the PALTAS API.
#
# A NEW DATABASE, DELIBERATELY.
#
# This does not reference the existing `paltas-db`. The start command runs
# `prisma migrate deploy`, and the seed data in that database (58 listings,
# 12 photographs) has an unresolved provenance question — so nothing here
# may migrate it. `paltas-api-db` below is a separate instance that this
# service owns outright.
#
# If you later decide the two should share a database, that is a decision to
# make once the provenance question is settled, and a migration to plan
# rather than a URL to paste.
# ======================================================================

services:
  - type: web
    # THE NAME OF THE ACTUAL SERVICE, because the old one cost an hour.
    #
    # This said `paltas-api`, which is not a service — paltas-api.onrender.com
    # returns 404. It is only a label, and it collides with the `service` string
    # in /health, so three different things appeared to be called paltas-api
    # while exactly one machine was serving: paltas-backend-production, which is
    # what netlify.toml proxies /api/* to.
    #
    # An environment variable set against the wrong one of those is invisible,
    # and the failure looks identical to not having set it at all.
    name: paltas-backend-production
    runtime: docker
    dockerfilePath: ./Dockerfile
    region: frankfurt          # same region as the database, or every query pays a round trip
    plan: starter
    healthCheckPath: /health
    # AUTO-DEPLOY, BECAUSE A MANUAL STEP IS ITS OWN FAILURE MODE.
    #
    # This was false, with the reasoning that a deploy should be a decision. It
    # cost a whole evening: three pushes sat on main looking deployed while the
    # service ran older code, and the first Manual Deploy then failed on a
    # Dockerfile problem nobody had seen because nothing had ever built it.
    #
    # main is protected by the suite that runs before a push, and a failed build
    # leaves the previous instance serving — so the risk of deploying
    # automatically is smaller than the risk of not knowing what is deployed.
    #
    # NOTE: this blueprint may still not govern the live service — it was
    # created in the dashboard rather than from this file. The dashboard toggle
    # is authoritative; check Settings -> Build & Deploy. The rename above makes
    # the two agree on what the service is CALLED, which is the part that was
    # actively misleading.
    autoDeploy: true

    envVars:
      - key: NODE_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: paltas-api-db
          property: connectionString

      # Render generates this once and keeps it. It is never in the repo.
      - key: SESSION_SECRET
        generateValue: true

      # sync: false means "Render will ask you for this in the dashboard".
      # Secrets are entered there, by a person, and never committed.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false

      - key: PUBLIC_URL
        sync: false            # e.g. https://api.paltas.io
      - key: APP_URL
        sync: false            # e.g. https://paltas.io
      - key: ALLOWED_ORIGINS
        sync: false            # optional; staging or local origins

      # ── ACCOMMODATION SUPPLY ──────────────────────────────────────────
      #
      # Declared here so a blueprint sync PRESERVES them. A variable that exists
      # only in the dashboard is one Render is not told about, and a sync can
      # remove it — which on this seam means the marketplace silently reverts to
      # showing no hotels at all, with no error anywhere to say why.
      #
      # Absent is a normal state: src/server.js connectSuppliers() registers
      # nothing, every supplier path returns an honest 503, and PALTAS's own
      # listings are unaffected. Set LITEAPI_KEY and real hotels appear.
      - key: LITEAPI_KEY
        sync: false            # prod_… or sand_… — the prefix decides sandbox mode
      - key: LITEAPI_CURRENCY
        sync: false            # optional; default USD

      # StayingAPI reads listings and prices from Airbnb, Booking.com, Vrbo and
      # the rest. It has NO booking endpoint, so it is deliberately NOT
      # registered as the marketplace's supplier — see src/suppliers/stayingapi.js.
      # The prefix decides the environment and nothing overrides it: stay_test_
      # is the deterministic sandbox and free, stay_live_ spends credits PER
      # RESULT, so nothing calls it on page load.
      # Either spelling works. STAYING_API_KEY is accepted as well, because it
      # is how most people type it; setting BOTH to different values is refused
      # rather than resolved, since that is a half-finished rotation.
      - key: STAYINGAPI_KEY
        sync: false            # stay_test_… or stay_live_… — the prefix decides
      - key: STAYINGAPI_CURRENCY
        sync: false            # optional; default USD
      - key: LITEAPI_NATIONALITY
        sync: false            # optional ISO-2 guest nationality; default US

      # LiteAPI's OWN Stripe publishable keys, for the hotel checkout. Issued by
      # a LiteAPI account manager, not visible in their dashboard. Public values
      # by design — a publishable key belongs in a web page — but still
      # configuration, because they are LiteAPI's to rotate. Without them the
      # marketplace shows rates and the checkout says plainly that the room
      # cannot be paid for yet.
      - key: LITEAPI_STRIPE_PK_TEST
        sync: false            # pk_test_… — only ever paired with a sand_ key
      - key: LITEAPI_STRIPE_PK_LIVE
        sync: false            # pk_live_… — only ever paired with a prod_ key

      # ── MEMBER COMPANIES COLLECTING FROM THEIR OWN CUSTOMERS ──────────
      #
      # Stripe Connect. Without STRIPE_WEBHOOK_SECRET no webhook can be verified,
      # and the verified webhook is the ONLY place a Payment row is written — so
      # payments would be taken and never recorded. The service logs loudly at
      # boot if a live key is set without one.
      - key: STRIPE_SECRET_KEY
        sync: false            # rk_… restricted key preferred over sk_…
      - key: STRIPE_WEBHOOK_SECRET
        sync: false            # whsec_…

databases:
  - name: paltas-api-db
    databaseName: paltas_api
    user: paltas_api
    region: frankfurt
    plan: basic-256mb
