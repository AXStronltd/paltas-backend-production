# ======================================================================
# PALTAS — Netlify configuration.
#
# Goes in the ROOT of the paltas-frontend repository, beside index.html.
# There is no build step: the repo is already the site.
#
# ── THE ONE LINE THAT MATTERS MOST ─────────────────────────────────────
#
# The `/api/*` proxy below. It is not a convenience — it is what makes
# sign-in work on an iPhone.
#
# Without it, the browser is on paltas.io and the API is on
# api.paltas.io, so the session cookie is THIRD-PARTY. Safari blocks
# third-party cookies by default; Chrome is removing them; Firefox
# partitions them. Sign-in would work perfectly in your browser and fail
# silently on every iPhone — no error, no console message, the cookie
# simply never stored.
#
# With the proxy, the browser only ever talks to paltas.io. The cookie is
# first-party, SameSite=Lax, and nothing is blocked by anybody. It also
# means there is no CORS at all, and no preflight round trip before every
# request.
#
# The backend works this out for itself: set its PUBLIC_URL to
# https://paltas.io/api and it switches the cookie to Lax. See
# src/config.js in paltas-backend.
# ======================================================================

[build]
  publish = "."
  # No build command. This is a static site by design — no bundler, no
  # framework, nothing to go wrong between the source and what ships.
  command = ""

[build.environment]
  NODE_VERSION = "22"

# ----------------------------------------------------------------------
# THE API, UNDER THE APP'S OWN DOMAIN.
#
# status = 200 makes this a PROXY, not a redirect. The browser never sees
# api.paltas.io and never learns there is a second host.
#
# `force = true` matters: without it, a real file or folder called `api`
# would win and the proxy would quietly stop working.
#
# Point `to` at the Render service. Use the custom domain if you have set
# one up, otherwise the onrender.com address — it is the same service.
#
# THE HOST BELOW IS THE LIVE ONE, and it is not obvious. `paltas-api` is a
# label — it is the service name in render.yaml and the `service` string in
# /health — but paltas-api.onrender.com returns 404. The machine is called
# paltas-backend-production. This line pointed at the label for a while, which
# would have 404'd every API call for anyone who adopted this file.
# ----------------------------------------------------------------------
[[redirects]]
  from = "/api/*"
  to = "https://paltas-backend-production.onrender.com/:splat"
  status = 200
  force = true

# ----------------------------------------------------------------------
# Tidy URLs for the pages that already exist.
# ----------------------------------------------------------------------
[[redirects]]
  from = "/owners"
  to = "/owners.html"
  status = 200

[[redirects]]
  from = "/partner"
  to = "/partner.html"
  status = 200

[[redirects]]
  from = "/dashboard"
  to = "/dashboard/index.html"
  status = 200

# ----------------------------------------------------------------------
# Headers.
#
# Deliberately NOT a Content-Security-Policy yet. index.html is one large
# page with inline scripts and inline styles; a CSP strict enough to be
# worth having would break it, and a CSP loose enough not to break it
# (unsafe-inline) protects against nothing. It is worth doing properly
# later, with nonces, as its own piece of work — not bolted on here where
# it would read as security and provide none.
# ----------------------------------------------------------------------
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # No camera, microphone or location. The site asks for none of them,
    # and saying so stops an embedded third party asking on its behalf.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(self), payment=()"

# The assets are large and they change together with a deploy, so they are
# worth caching hard — but ONLY the ones whose content is stable. There is
# no content hash in these filenames, so `must-revalidate` keeps the
# browser honest after a deploy rather than serving a stale console for a
# year.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600, must-revalidate"

[[headers]]
  for = "/assets/*.png"
  [headers.values]
    Cache-Control = "public, max-age=604800"

# The pages themselves must never be cached hard. index.html carries the
# whole marketplace; a visitor holding yesterday's copy is a visitor
# looking at yesterday's prices.
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ----------------------------------------------------------------------
# DEPLOY PREVIEWS.
#
# Netlify gives every pull request its own hostname
# (deploy-preview-7--paltas.netlify.app). The proxy above still works
# there, because it is relative — the preview proxies to the same Render
# service, and the cookie is first-party on the preview's own hostname.
#
# That is worth knowing before it surprises somebody: a preview shares the
# production DATABASE. It is a preview of the frontend, not of the system.
# Do not click Publish on a promotion from one.
# ----------------------------------------------------------------------
